name: KBL Samsung Thunders Alert
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '테스트 시 --demo-ot 입력 (실제 감시는 비워두기)'
        required: false
        default: '--demo-ot'
  schedule:
    - cron: '15 4 * * 0,6'   # 주말 오후 2시 경기 (한국시간 13:15 가동)
    - cron: '45 6 * * 0,6'   # 주말 오후 4시 30분 경기 (한국시간 15:45 가동)
    - cron: '15 9 * * *'     # 평일/주말 저녁 7시 경기 (한국시간 18:15 가동)

jobs:
  kbl-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run KBL Samsung Notifier
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python kbl_samsung_notifier.py ${{ github.event.inputs.mode }}
          else
            python kbl_samsung_notifier.py --cloud-auto
          fi
